name: Bionic Panda Games
description: Bionic Panda Games was a cross-platform mobile social games company founded in March 2010
  by Charles Hudson (CEO) and Mike Jimenez (CTO), headquartered in San Francisco, California. The studio
  focused on Android-first social and casual titles, shipping Aqua Pets (a fishing and aquarium simulation
  that reached several million downloads and a top-100 grossing spot on Android), Vacation Slots, and
  PicAPic Camera. It raised seed funding from SoftTech VC, Norwest Venture Partners, Google Ventures,
  500 Startups, and angel investors before ceasing operations. It is tracked in the API Evangelist network
  as a 500 Global portfolio company; the studio published no public developer API, so this profile carries
  identity and domain-security signals only.
